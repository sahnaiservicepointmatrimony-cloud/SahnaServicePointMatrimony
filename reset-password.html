<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Password Reset - Sahna Service Point Matrimony</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="top-header">
    <div class="brand">
      Sahna Service Point Matrimony
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
    </nav>
  </header>


  <main style="
    min-height:70vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#fff7fb,#fff1f5);
    padding:30px;
  ">

    <div style="
      background:white;
      padding:35px;
      border-radius:20px;
      width:100%;
      max-width:450px;
      box-shadow:0 10px 30px rgba(120,0,60,0.12);
    ">

      <h1 style="
        text-align:center;
        color:#7b1745;
      ">
        🔐 पासवर्ड रीसेट
      </h1>

      <p style="
        text-align:center;
        color:#666;
        margin-bottom:25px;
      ">
        अपना Registered Email डालें
      </p>


      <form id="resetForm">

        <label>Email ID</label>

        <input
          type="email"
          id="resetEmail"
          placeholder="अपना Email लिखें"
          required
          style="
            width:100%;
            padding:13px;
            margin:8px 0 18px;
            border:1px solid #ddd;
            border-radius:10px;
            box-sizing:border-box;
          "
        >


        <button
          type="submit"
          style="
            width:100%;
            padding:14px;
            border:none;
            border-radius:25px;
            background:#c92d72;
            color:white;
            font-size:16px;
            cursor:pointer;
          "
        >
          पासवर्ड Reset Email भेजें
        </button>

      </form>


      <p style="text-align:center;margin-top:20px;">
        <a href="login.html">
          ← Login पर वापस जाएँ
        </a>
      </p>

    </div>

  </main>


  <footer>
    © 2026 Sahna Service Point Matrimony
  </footer>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    const SUPABASE_URL =
      "https://gqohlbnnsxatjyyacjhm.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_I-MvPhhHQsexbJIN-ueawA_5oxdJhsJ";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    document
      .getElementById("resetForm")
      .addEventListener("submit", async function(e) {

        e.preventDefault();

        const email =
          document.getElementById("resetEmail").value.trim();


        const { error } =
          await supabaseClient.auth.resetPasswordForEmail(
            email
          );


        if (error) {

          alert(
            "Password Reset में समस्या हुई: " +
            error.message
          );

          return;
        }


        alert(
          "Password Reset Email भेज दिया गया ❤️\n\n" +
          "अपने Gmail का Inbox और Spam/Junk folder भी देखें।"
        );

      });

  </script>

</body>

</html>
