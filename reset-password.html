<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Password Reset - Sahnai Service Point Matrimony</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="top-header">
    <div class="brand">
      Sahnai Service Point Matrimony
    </div>

    <nav>
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
    </nav>
  </header>


  <main style="
    min-height:70vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#fff7fb,#fff1f5);
    padding:30px;
  ">

    <div style="
      background:white;
      padding:35px;
      border-radius:20px;
      width:100%;
      max-width:450px;
      box-shadow:0 10px 30px rgba(120,0,60,0.12);
    ">

      <h1 style="
        text-align:center;
        color:#7b1745;
      ">
        🔐 पासवर्ड रीसेट
      </h1>

      <p style="
        text-align:center;
        color:#666;
        margin-bottom:25px;
      ">
        अपना Registered Email डालें
      </p>


      <form id="resetForm">

        <label>Email ID</label>

        <input
          type="email"
          id="resetEmail"
          placeholder="अपना Email लिखें"
          required
          style="
            width:100%;
            padding:13px;
            margin:8px 0 18px;
            border:1px solid #ddd;
            border-radius:10px;
            box-sizing:border-box;
          "
        >


        <button
          type="submit"
          style="
            width:100%;
            padding:14px;
            border:none;
            border-radius:25px;
            background:#c92d72;
            color:white;
            font-size:16px;
            cursor:pointer;
          "
        >
          पासवर्ड Reset Email भेजें
        </button>

      </form>


      <p style="text-align:center;margin-top:20px;">
        <a href="login.html">
          ← Login पर वापस जाएँ
        </a>
      </p>

    </div>

  </main>


  <footer>
    © 2026 Sahnai Service Point Matrimony
  </footer>


  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    const SUPABASE_URL =
      "https://gqohlbnnsxatjyyacjhm.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_I-MvPhhHQsexbJIN-ueawA_5oxdJhsJ";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


  document.addEventListener("DOMContentLoaded", async () => {

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
      auth: {
        persistSession: true,sword
        autoRefreshToken: true,
        detectSessionInUrl: true,
        storageKey: "sahna-matrimony-auth"
      }
    }
  );

  const sessionResult = await supabaseClient.auth.getSession();
  const session = sessionResult.data.session;

  if (session) {
    document.getElementById("resetForm").style.display = "none";

    const box = document.createElement("div");

    box.innerHTML = `
      <h2 style="text-align:center;">🔐 नया Password बनाएं</h2>

      <label>नया Password</label>
      <input
        type="password"
        id="newPassword"
        placeholder="नया Password लिखें"
        minlength="6"
        required
        style="width:100%;padding:13px;margin:10px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box;"
      >

      <label>Confirm Password</label>
      <input
        type="password"
        id="confirmPassword"
        placeholder="Password दोबारा लिखें"
        minlength="6"
        required
        style="width:100%;padding:13px;margin:10px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box;"
      >

      <button
        id="updatePasswordBtn"
        style="width:100%;padding:14px;border:none;border-radius:25px;background:#9d27b0;color:white;font-size:16px;cursor:pointer;margin-top:10px;"
      >
        🔑 Password Update करें
      </button>
    `;

    document.getElementById("resetForm").parentElement.appendChild(box);

    document.getElementById("updatePasswordBtn").onclick = async () => {

      const newPassword =
        document.getElementById("newPassword").value;

      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (newPassword.length < 6) {
        alert("Password कम से कम 6 characters का होना चाहिए।");
        return;
      }

      if (newPassword !== confirmPassword) {
        alert("दोनों Password एक जैसे नहीं हैं।");
        return;
      }

      const { error } =
        await supabaseClient.auth.updateUser({
          password: newPassword
        });

      if (error) {
        alert("Password Update में समस्या: " + error.message);
        return;
      }

      alert("✅ Password सफलतापूर्वक बदल गया!");

      await supabaseClient.auth.signOut();

      window.location.href = "login.html";
    };
  }

  document.getElementById("resetForm")
    .addEventListener("submit", async function(e) {

      e.preventDefault();

      const email =
        document.getElementById("resetEmail").value.trim();

      if (!email) {
        alert("कृपया Email ID लिखें।");
        return;
      }

      const { error } =
        await supabaseClient.auth.resetPasswordForEmail(
          email,
          {
            redirectTo:
              window.location.origin + "/reset-password.html"
          }
        );

      if (error) {
        alert("Password Reset में समस्या: " + error.message);
        return;
      }

      alert(
        "✅ Password Reset Email भेज दिया गया है।\n\n" +
        "अपने Gmail Inbox और Spam/Junk folder को check करें।"
      );
    });
});

  </script>

</body>

</html>
